name: Revisión diaria de comprar.gob.ar

# Sin "schedule": cas.gde.gob.ar (login de GDE) bloquea con un desafío de
# Cloudflare a las IPs de datacenter de los runners de GitHub Actions, así
# que la revisión diaria real corre en la PC del usuario (ver README,
# sección "Correr el scraper en tu PC"). Este workflow queda solo para
# disparar corridas manuales de debug si hace falta recalibrar algo.
#
# Nota: scripts/scrape.ts ahora lanza el navegador con headless:false
# (para evadir mejor la detección de Cloudflare), lo que probablemente
# no funcione en este runner sin pantalla — la calibración real se hace
# en la PC del usuario, este workflow puede no servir más que de backup.
on:
  workflow_dispatch:
    inputs:
      debug:
        description: "Guardar capturas/HTML de debug como artifact (para calibrar selectores)"
        type: boolean
        default: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Ejecutar scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COMPRAR_USER: ${{ secrets.COMPRAR_USER }}
          COMPRAR_GDE_USER: ${{ secrets.COMPRAR_GDE_USER }}
          COMPRAR_PASS: ${{ secrets.COMPRAR_PASS }}
          AVISO_VENCIMIENTO_DIAS: ${{ vars.AVISO_VENCIMIENTO_DIAS }}
        run: |
          if [ "${{ inputs.debug }}" = "true" ]; then
            npm run scrape -- --debug
          else
            npm run scrape
          fi

      - name: Subir capturas de debug
        if: always() && inputs.debug == true
        uses: actions/upload-artifact@v4
        with:
          name: scrape-debug
          path: scripts/debug/
          if-no-files-found: ignore
          retention-days: 7
